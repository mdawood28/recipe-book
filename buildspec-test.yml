version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm ci

  build:
    commands:
      - echo Building Tailwind CSS...
      - npm run build:css

  post_build:
    commands:
      - echo Checking application files...
      - test -f app.js
      - test -f package.json
      - test -f public/css/style.css
      - echo Application checks passed!
